{%extends 'online_store/base.html' %}
{% block title %}Удалить Категорию{% endblock %}
{% block show_store%}{% include 'online_store/menu.html' %}  {% endblock %}
{% block content %}
h2>Удалить Категорию</h2>
<p>Вы уверены, что хотите удалить "{{product.name}}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'online_store:category_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
